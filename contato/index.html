<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato | Mada Wine & Beer</title>
  <meta name="description" content="Canais oficiais de contato da Mada Wine & Beer. Conteúdo destinado a maiores de 18 anos.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://madawin.com.br/contato/">
  <meta property="og:title" content="Contato | Mada Wine & Beer">
  <meta property="og:description" content="Canais oficiais de contato da Mada Wine & Beer. Conteúdo destinado a maiores de 18 anos.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://madawin.com.br/contato/">
  
<style>
:root {
  --green: #0f2318;
  --gold: #d4af37;
  --cream: #fff8e7;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--green);
  color: var(--cream);
  line-height: 1.6;
}
main {
  max-width: 920px;
  margin: 0 auto;
  padding: 56px 22px;
}
.card {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(212,175,55,.45);
  border-radius: 22px;
  padding: 32px;
}
h1 {
  color: var(--gold);
  margin-top: 0;
}
a {
  color: var(--gold);
}
nav {
  margin-bottom: 28px;
}
nav a {
  margin-right: 16px;
}
</style>


<style id="mw-header-logo-style">
.mw-header-logo-img{
  width: 56px !important;
  height: 56px !important;
  object-fit: contain !important;
  display: block !important;
  border-radius: 12px !important;
}
</style>

</head>
<body>
  <main>
    
<nav>
  <a href="/">Início</a>
  <a href="/sobre/">Sobre</a>
  <a href="/contato/">Contato</a>
  <a href="/aviso-de-maioridade/">Aviso de maioridade</a>
</nav>

    <section class="card">
      <h1>Contato</h1>
      
        <p>Use os canais oficiais da Mada Wine & Beer para informações institucionais.</p>
        <p>O conteúdo deste site é destinado exclusivamente a maiores de 18 anos.</p>
        
      <p><a href="/">Voltar para a página inicial</a></p>
    </section>
  </main>

<script id="mw-header-logo-script">
document.addEventListener('DOMContentLoaded', function () {
  const logoPath = '/assets/img/madawin-logo.png';

  const titleEl = Array.from(document.querySelectorAll('body *'))
    .find(el => (el.textContent || '').trim() === 'Mada Wine & Beer');

  if (!titleEl) return;

  const scope =
    titleEl.closest('header, nav, .header, .navbar, .topbar, .site-header') ||
    titleEl.parentElement?.parentElement ||
    document.body;

  const candidates = Array.from(scope.querySelectorAll('*')).filter(el => {
    const txt = (el.textContent || '').trim();
    const r = el.getBoundingClientRect();
    return txt === 'M' && r.width >= 20 && r.height >= 20 && r.width <= 120 && r.height <= 120;
  });

  const pick = candidates[0];
  if (!pick || pick.querySelector('.mw-header-logo-img')) return;

  pick.textContent = '';
  pick.innerHTML = '<img src="' + logoPath + '" alt="Mada Wine & Beer" class="mw-header-logo-img">';

  pick.style.width = '56px';
  pick.style.height = '56px';
  pick.style.display = 'flex';
  pick.style.alignItems = 'center';
  pick.style.justifyContent = 'center';
  pick.style.background = 'transparent';
  pick.style.border = 'none';
  pick.style.boxShadow = 'none';
  pick.style.overflow = 'visible';

  const parent = pick.parentElement;
  if (parent && !parent.style.gap) {
    parent.style.gap = '12px';
  }
});
</script>

</body>
</html>
